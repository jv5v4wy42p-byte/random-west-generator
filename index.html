<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROY SPIT — Random West</title><style>*{box-sizing:border-box}body{margin:0;background:#eee5d3;font-family:Georgia,serif;color:#2d241c;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{width:min(760px,94vw);background:#d8c5a8;padding:14px;box-shadow:0 5px 20px #0002}.head{text-align:center;font-size:18px;letter-spacing:3px;margin:4px 0 12px}.frame{position:relative;background:#c7b79e;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}img{width:100%;max-height:520px;object-fit:cover;display:block}.status{position:absolute;font-size:18px}button{display:block;margin:12px auto 2px;border:1px solid #2d241c;background:#eee5d3;color:#2d241c;padding:7px 18px;font:inherit;cursor:pointer}.credit{text-align:center;font-size:11px;margin-top:8px;opacity:.7}</style></head><body><div class="card"><div class="head">⛰︎ RANDOM WEST ⛰︎</div><div class="frame"><div class="status" id="status">Searching the Southwest…</div><img id="photo" alt="" hidden></div><button onclick="newPhoto()">↻ NEW</button><div class="credit" id="credit"></div></div><script>const queries=["New Mexico desert","New Mexico landscape","New Mexico adobe","New Mexico mountains","New Mexico ghost town","New Mexico road","Southwest United States desert","New Mexico ranch","New Mexico pueblo","New Mexico mining"];async function newPhoto(){const s=document.getElementById('status'),i=document.getElementById('photo'),c=document.getElementById('credit');s.hidden=false;s.textContent='Searching the Southwest…';i.hidden=true;c.textContent='';const q=queries[Math.floor(Math.random()*queries.length)];try{const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1400&format=json&origin=*';const d=await fetch(u).then(r=>r.json()),p=Object.values(d.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl);if(!p.length)throw 0;const x=p[Math.floor(Math.random()*p.length)],m=x.imageinfo[0];i.src=m.thumburl;i.onload=()=>{s.hidden=true;i.hidden=false};c.textContent='Wikimedia Commons · '+(m.extmetadata?.Artist?.value||'').replace(/<[^>]*>/g,'')}catch(e){s.textContent='No photo found — press NEW'}}newPhoto();</script></body></html>
