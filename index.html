<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random West</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8c39f;color:#38291c;font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:14px}.card{width:min(760px,100%);background:#ead8b7;border:2px solid #6b4b2b;border-radius:10px;box-shadow:0 5px 18px #0003;padding:18px;text-align:center}.title{font-size:22px;letter-spacing:3px;font-weight:bold;margin:2px 0 12px}.frame{background:#c4aa80;border:1px solid #6b4b2b;padding:8px;min-height:250px;display:flex;align-items:center;justify-content:center}.frame img{display:block;width:100%;max-height:520px;object-fit:cover}.loading{padding:70px 10px;font-style:italic}.category{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:12px 0 8px}.button{appearance:none;border:1px solid #5d4025;background:#7b5734;color:#f5e7c9;padding:9px 20px;border-radius:5px;font-family:Georgia,serif;font-size:15px;cursor:pointer}.button:hover{background:#5d4025}.credit{font-size:11px;margin-top:10px;color:#66503a;min-height:16px}.credit a{color:inherit}.error{padding:55px 10px;line-height:1.5}.source{font-size:10px;margin-top:6px;opacity:.75}
</style>
</head>
<body>
<div class="card">
  <div class="title">⛰︎ RANDOM WEST ⛰︎</div>
  <div class="frame" id="frame"><div class="loading">Searching the Southwest…</div></div>
  <div class="category" id="category"></div>
  <button class="button" id="newBtn">↻ NEW</button>
  <div class="credit" id="credit"></div>
  <div class="source">Images from Wikimedia Commons</div>
</div>
<script>
const categories=[
 ['NEW MEXICO / DESERT','New Mexico desert landscape'],
 ['SOUTHWEST LANDSCAPE','Southwestern United States landscape New Mexico'],
 ['GHOST TOWN','New Mexico ghost town'],
 ['MINING','New Mexico mining town'],
 ['OLD ROAD','New Mexico old road'],
 ['ADOBE / PUEBLO','New Mexico adobe pueblo'],
 ['WESTERN TOWN','New Mexico western town'],
 ['RANCH / HORSES','New Mexico ranch horses'],
 ['MESA / MOUNTAINS','New Mexico mesa mountains'],
 ['MOTEL / ROADSIDE','New Mexico roadside motel']
];
let lastCategory=-1;
const frame=document.getElementById('frame'),cat=document.getElementById('category'),credit=document.getElementById('credit'),btn=document.getElementById('newBtn');
function cleanArtist(v){return String(v||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim();}
async function newPhoto(){
 btn.disabled=true; cat.textContent=''; credit.textContent=''; frame.innerHTML='<div class="loading">Searching the Southwest…</div>';
 let i=Math.floor(Math.random()*categories.length); if(categories.length>1&&i===lastCategory)i=(i+1)%categories.length; lastCategory=i;
 const [label,query]=categories[i]; cat.textContent=label;
 try{
  const p=new URLSearchParams({action:'query',generator:'search',gsrsearch:query,gsrnamespace:'6',gsrlimit:'50',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'1400',format:'json',formatversion:'2',origin:'*'});
  const r=await fetch('https://commons.wikimedia.org/w/api.php?'+p.toString());
  if(!r.ok) throw new Error('API');
  const d=await r.json();
  const pages=Object.values(d.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url);
  if(!pages.length) throw new Error('No images');
  const page=pages[Math.floor(Math.random()*pages.length)]; const info=page.imageinfo[0];
  const src=info.thumburl||info.url;
  const artist=cleanArtist(info.extmetadata?.Artist?.value||'');
  frame.innerHTML='';
  const img=document.createElement('img'); img.alt=page.title.replace(/^File:/,''); img.src=src;
  frame.appendChild(img);
  img.onerror=()=>{frame.innerHTML='<div class="error">This image could not be loaded.<br>Press NEW for another one.</div>';};
  const link=document.createElement('a'); link.href='https://commons.wikimedia.org/wiki/'+encodeURIComponent(page.title.replace(/ /g,'_')); link.target='_blank'; link.rel='noopener'; link.textContent=artist?('Photo: '+artist):'Open source'; credit.appendChild(link);
 }catch(e){
  frame.innerHTML='<div class="error">No image found right now.<br>Press NEW to try again.</div>';
 }
 btn.disabled=false;
}
btn.addEventListener('click',newPhoto);newPhoto();
</script>
</body>
</html>
