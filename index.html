<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random West</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e8d6b5;color:#3b2a1d;font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center;padding:18px}
  .card{width:min(100%,560px);background:#d9bf96;border:2px solid #5b3b25;border-radius:6px;padding:14px;box-shadow:0 4px 14px rgba(55,35,18,.22)}
  h1{text-align:center;font-size:25px;letter-spacing:2px;margin:0 0 12px;text-shadow:1px 1px #ecd9b7}
  .frame{background:#2d2118;border:8px solid #7a5435;padding:4px;min-height:270px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  img{display:block;width:100%;height:330px;object-fit:cover;background:#33271e}
  .loading{color:#e8d6b5;text-align:center;font-style:italic;padding:80px 10px}
  .category{text-align:center;font-size:17px;font-weight:bold;letter-spacing:1px;margin:12px 0 4px}
  .credit{text-align:center;font-size:11px;opacity:.75;min-height:16px}
  button{display:block;margin:12px auto 2px;background:#5b3b25;color:#f1dfbd;border:1px solid #3b281a;border-radius:4px;padding:9px 24px;font-family:Georgia,serif;font-size:15px;cursor:pointer;box-shadow:0 2px 3px rgba(0,0,0,.2)}
  button:active{transform:translateY(1px)}
  .source{text-align:center;margin-top:8px;font-size:10px}
  .source a{color:#5b3b25}
</style>
</head>
<body>
<div class="card">
  <h1>⛰︎ RANDOM WEST ⛰︎</h1>
  <div class="frame" id="frame"><div class="loading">Searching the West…</div></div>
  <div class="category" id="category">—</div>
  <div class="credit" id="credit"></div>
  <button id="newBtn">↻ NEW</button>
  <div class="source"><a id="searchLink" href="#" target="_blank" rel="noopener">open search</a></div>
</div>
<script>
const categories = [
  ['NEW MEXICO / DESERT','new mexico desert landscape'],
  ['SOUTHWEST LANDSCAPE','southwestern united states landscape'],
  ['GHOST TOWN','new mexico ghost town'],
  ['MINING','new mexico mining town'],
  ['OLD ROAD','new mexico old road'],
  ['ADOBE / PUEBLO','new mexico adobe pueblo'],
  ['WESTERN TOWN','new mexico western town'],
  ['RANCH / HORSES','new mexico ranch horses'],
  ['MESA / MOUNTAINS','new mexico mesa mountains'],
  ['MOTEL / ROADSIDE','new mexico roadside motel']
];

let lastIndex = -1;
function pickCategory(){
  let i;
  do{i=Math.floor(Math.random()*categories.length)}while(i===lastIndex && categories.length>1);
  lastIndex=i; return categories[i];
}

function showImage(src, label, query){
  const frame=document.getElementById('frame');
  const img=new Image();
  img.alt=label;
  img.onload=()=>{frame.innerHTML='';frame.appendChild(img)};
  img.onerror=()=>loadImage();
  img.src=src + (src.includes('?')?'&':'?') + 't=' + Date.now();
  document.getElementById('category').textContent=label;
  document.getElementById('credit').textContent='Random image from the web';
  document.getElementById('searchLink').href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(query);
}

function loadImage(){
  const [label,query]=pickCategory();
  document.getElementById('frame').innerHTML='<div class="loading">Searching the West…</div>';
  document.getElementById('category').textContent=label;
  document.getElementById('credit').textContent='';
  document.getElementById('searchLink').href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(query);

  // LoremFlickr serves a random Flickr photograph for a keyword without an API key.
  // The extra random tag prevents the browser from keeping the previous image.
  const url='https://loremflickr.com/1000/650/'+encodeURIComponent(query.replace(/ /g,','))+'?random='+Math.random();
  showImage(url,label,query);
}

document.getElementById('newBtn').addEventListener('click',loadImage);
loadImage();
</script>
</body>
</html>
